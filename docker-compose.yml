services:
  postgres:
    image: postgres:17-alpine
    container_name: hydra-market-postgres
    environment:
      POSTGRES_DB: hydra_market
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra
    ports:
      - "5432:5432"
    volumes:
      - hydra_postgres_data:/var/lib/postgresql/data

volumes:
  hydra_postgres_data: